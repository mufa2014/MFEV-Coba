<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengingat Servis - MF.EV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm w-full">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all text-slate-600">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-slate-900 leading-tight flex items-center gap-2">
            MF.EV <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-semibold">PENGINGAT</span>
          </h1>
          <p class="text-xs text-slate-500 hidden sm:block">Pengingat Jadwal Servis Berkala</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="muatData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 sm:px-4 rounded-xl font-medium text-xs sm:text-sm flex items-center gap-2 transition-all shadow-sm">
          <i class="fa-solid fa-rotate"></i> <span class="hidden sm:inline">Muat Ulang</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-4">
    
    <!-- KETERANGAN WARNA BADGE -->
    <div class="flex flex-wrap items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200 text-xs font-medium text-slate-600">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500"></span>
        <span>Merah = Sudah Lewat</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-amber-500"></span>
        <span>Kuning = &le;7 Hari Lagi</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
        <span>Hijau = Masih Aman</span>
      </div>
      <div class="flex items-center gap-2 sm:ml-auto border-t sm:border-t-0 sm:border-l pt-2 sm:pt-0 pl-0 sm:pl-4 border-slate-200 w-full sm:w-auto">
        <span class="w-3 h-3 rounded-full bg-blue-500"></span>
        <span>Sudah Dihubungi WA</span>
      </div>
    </div>

    <!-- TABLE CONTAINER -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden w-full">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-base sm:text-lg">
          <i class="fa-solid fa-bell text-amber-500"></i>
          <span>Daftar Pengingat Servis</span>
        </div>
        
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari nama, plat, merk..." 
            class="w-full pl-10 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 bg-slate-50/50">
        </div>
      </div>

      <!-- TABLE AREA -->
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left text-sm text-slate-600 min-w-[800px]">
          <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3.5 px-4">STATUS</th>
              <th class="py-3.5 px-4">PELANGGAN / HP</th>
              <th class="py-3.5 px-4">MOTOR &amp; PLAT</th>
              <th class="py-3.5 px-4">SERVIS TERAKHIR</th>
              <th class="py-3.5 px-4">JADWAL NEXT</th>
              <th class="py-3.5 px-4">SISA WAKTU</th>
              <th class="py-3.5 px-4 text-center">INGATKAN</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-amber-500"></i>
                <p>Memuat jadwal pengingat...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqMV2lQsLeG2C70787Qw4zarJWv1023AxZj2XLuo_tUOMSVkash0ZeiXSs14BwqpI4/exec";
    let rawData = [];

    document.addEventListener("DOMContentLoaded", function() {
      muatData();
    });

    function formatNoHP(val) {
      if (!val) return "";
      let hp = String(val).trim().replace(/[^0-9]/g, "");
      if (hp.startsWith("8")) hp = "0" + hp;
      return hp;
    }

    function formatWA(val) {
      let hp = formatNoHP(val);
      if (hp.startsWith("0")) hp = "62" + hp.substring(1);
      return hp;
    }

    function muatData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-amber-500"></i><p>Memuat data dari Spreadsheet...</p></td></tr>';

      fetch(SCRIPT_URL + "?t=" + new Date().getTime())
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (Array.isArray(data)) {
            rawData = data.filter(function(d) {
              return d.TanggalBerikutnya && String(d.TanggalBerikutnya).trim() !== "";
            });
            renderTable(rawData);
          } else {
            tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-red-500 font-semibold">Gagal memuat data.</td></tr>';
          }
        })
        .catch(function(err) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-500">Gagal terhubung ke koneksi internet/spreadsheet.</td></tr>';
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">Tidak ada jadwal pengingat servis.</td></tr>';
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      let html = "";
      data.forEach(function(item) {
        const hpFormatted = formatNoHP(item.NoHP);
        const waNumber = formatWA(item.NoHP);

        const isoNext = formatTanggalUntukInput(item.TanggalBerikutnya);
        const tglNext = new Date(isoNext);
        tglNext.setHours(0,0,0,0);

        const diffTime = tglNext - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        let statusBadge = "";
        let sisaWaktuText = "";

        if (diffDays < 0) {
          statusBadge = '<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1 w-max"><i class="fa-solid fa-triangle-exclamation"></i> Terlewat</span>';
          sisaWaktuText = '<span class="text-red-600 font-semibold">Lewat ' + Math.abs(diffDays) + ' hari</span>';
        } else if (diffDays <= 7) {
          statusBadge = '<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1 w-max"><i class="fa-solid fa-clock"></i> Segera</span>';
          sisaWaktuText = '<span class="text-amber-600 font-semibold">' + (diffDays === 0 ? 'Hari ini' : diffDays + ' hari lagi') + '</span>';
        } else {
          statusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1 w-max"><i class="fa-solid fa-circle-check"></i> Aman</span>';
          sisaWaktuText = '<span class="text-slate-600">' + diffDays + ' hari lagi</span>';
        }

        const isDihubungi = item.SudahDihubungi === true || String(item.SudahDihubungi).toUpperCase() === "TRUE";

        let notifStatus = "";
        let btnWAClass = "bg-emerald-600 hover:bg-emerald-700 text-white";
        let btnWAText = "Kirim WA";

        if (isDihubungi) {
          notifStatus = '<div class="mt-1 flex items-center gap-1 text-[11px] font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md w-max border border-blue-100"><i class="fa-solid fa-circle-check"></i> Sudah Dihubungi</div>';
          btnWAClass = "bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-300";
          btnWAText = "Kirim Ulang WA";
        }

        const teksPesan = "Halo Kak " + (item.Nama || '') + ",\n\n" +
          "Kami dari *MF.EV Service* ingin menginfokan bahwa jadwal servis berkala untuk motor listrik Kakak (" + (item.MerkMotor || '') + " " + (item.TipeMotor || '') + " - " + (item.NoPlat || '') + ") adalah pada tanggal *" + formatTanggalDisplay(item.TanggalBerikutnya) + "*.\n\n" +
          "Yuk lakukan servis berkala agar kondisi kendaraan tetap prima! Silakan balas pesan ini untuk booking jadwal ya Kak. Terima kasih!";

        const pesanEncoded = encodeURIComponent(teksPesan);

        html += '<tr class="hover:bg-slate-50/80 transition-colors">' +
            '<td class="py-4 px-4 whitespace-nowrap">' + statusBadge + notifStatus + '</td>' +
            '<td class="py-4 px-4">' +
              '<div class="font-bold text-slate-900 flex items-center gap-2">' + 
                (item.Nama || '-') + 
                (hpFormatted ? '<button onclick="simpanKontakVCF(\'' + (item.Nama || 'Pelanggan MFEV') + '\', \'' + hpFormatted + '\')" title="Simpan ke Kontak HP" class="text-slate-400 hover:text-emerald-600 text-xs p-1"><i class="fa-solid fa-user-plus"></i></button>' : '') +
              '</div>' +
              '<div class="text-xs text-slate-500 font-mono">' + (hpFormatted || '-') + '</div>' +
            '</td>' +
            '<td class="py-4 px-4">' +
              '<div class="font-medium text-slate-800">' + (item.MerkMotor || '-') + ' ' + (item.TipeMotor || '') + '</div>' +
              '<div class="text-xs text-slate-400">Plat: ' + (item.NoPlat || '-') + '</div>' +
            '</td>' +
            '<td class="py-4 px-4 text-xs text-slate-500 whitespace-nowrap">' + formatTanggalDisplay(item.Tanggal) + '</td>' +
            '<td class="py-4 px-4 font-bold text-slate-800 whitespace-nowrap">' + formatTanggalDisplay(item.TanggalBerikutnya) + '</td>' +
            '<td class="py-4 px-4 text-xs whitespace-nowrap">' + sisaWaktuText + '</td>' +
            '<td class="py-4 px-4 text-center whitespace-nowrap">' +
              '<div class="flex items-center justify-center gap-1">' +
                '<button onclick="kirimWA(' + item.rowId + ', \'' + waNumber + '\', \'' + pesanEncoded + '\')" class="px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm ' + btnWAClass + '">' +
                  '<i class="fa-brands fa-whatsapp text-sm"></i> ' + btnWAText +
                '</button>' +
                (isDihubungi ? '<button onclick="resetStatusDihubungi(' + item.rowId + ')" title="Tandai Belum Dihubungi" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg"><i class="fa-solid fa-rotate-left text-xs"></i></button>' : '') +
              '</div>' +
            '</td>' +
          '</tr>';
      });

      tbody.innerHTML = html;
    }

    // FUNGSI UNTUK MERENDAH & MEMBUAT FILE VCF (SIMPAN KONTAK AUTOMATIS)
    function simpanKontakVCF(nama, noHP) {
      if (!noHP) {
        alert("Nomor HP tidak ada!");
        return;
      }
      
      const formatHP = noHP.startsWith("0") ? "+62" + noHP.substring(1) : noHP;
      const vcard = "BEGIN:VCARD\n" +
                    "VERSION:3.0\n" +
                    "FN:" + nama + " (MF.EV)\n" +
                    "TEL;TYPE=CELL:" + formatHP + "\n" +
                    "END:VCARD";

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nama.replace(/[^a-zA-Z0-9]/g, "_") + "_MFEV.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function kirimWA(rowId, waNumber, pesanEncoded) {
      if (!waNumber) {
        alert("Nomor HP / WA tidak valid!");
        return;
      }

      window.open("https://wa.me/" + waNumber + "?text=" + pesanEncoded, "_blank");
      updateStatusDihubungi(rowId, true);
    }

    function resetStatusDihubungi(rowId) {
      if (confirm("Ubah status menjadi Belum Dihubungi?")) {
        updateStatusDihubungi(rowId, false);
      }
    }

    function updateStatusDihubungi(rowId, isDihubungi) {
      const item = rawData.find(function(d) { return Number(d.rowId) === Number(rowId); });
      if (item) {
        item.SudahDihubungi = isDihubungi;
        renderTable(rawData);
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateDihubungi",
          rowId: rowId,
          SudahDihubungi: isDihubungi
        })
      }).catch(function(err) {
        console.error("Gagal memperbarui status ke Sheets:", err);
      });
    }

    function filterTable() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = rawData.filter(function(d) { 
        return (d.Nama && d.Nama.toLowerCase().includes(q)) ||
               (d.NoHP && String(d.NoHP).toLowerCase().includes(q)) ||
               (d.NoPlat && d.NoPlat.toLowerCase().includes(q)) ||
               (d.MerkMotor && d.MerkMotor.toLowerCase().includes(q));
      });
      renderTable(filtered);
    }

    function formatTanggalUntukInput(str) {
      if (!str) return "";
      if (str.includes("T")) str = str.split("T")[0];
      if (str.includes("/")) {
        const p = str.split("/");
        if (p.length === 3) return p[2] + "-" + p[1].padStart(2,'0') + "-" + p[0].padStart(2,'0');
      }
      if (str.includes("-")) {
        const p = str.split("-");
        if (p[0].length === 4) return str; 
        if (p[2].length === 4) return p[2] + "-" + p[1].padStart(2,'0') + "-" + p[0].padStart(2,'0');
      }
      return str;
    }

    function formatTanggalDisplay(str) {
      if (!str) return "-";
      const iso = formatTanggalUntukInput(str);
      const p = iso.split("-");
      if (p.length === 3) return p[2] + "-" + p[1] + "-" + p[0];
      return str;
    }
  </script>
</body>
</html>
