<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengingat Servis Berkala - MF.EV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center w-11 h-11">
          <i class="fa-solid fa-bolt-lightning text-xl text-yellow-300"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight flex items-center gap-2">
            MF.EV <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-semibold">PENGINGAT</span>
          </h1>
          <p class="text-xs text-slate-500">Jadwal Servis Berkala Pelanggan</p>
        </div>
      </div>
      <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-medium text-sm flex items-center gap-2 transition-all">
        <i class="fa-solid fa-arrow-left"></i> Kembali
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
    
    <!-- LEGEND & BAR -->
    <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-4 text-xs font-medium">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> Merah = Sudah Lewat</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> Kuning = &le;7 Hari Lagi</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Hijau = Masih Aman</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="muatData()" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all">
          <i class="fa-solid fa-rotate"></i> Muat Ulang
        </button>
        <span id="statusText" class="text-xs text-slate-400">Menghubungkan...</span>
      </div>
    </div>

    <!-- TABLE CARD -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <i class="fa-solid fa-bell text-amber-500"></i> Daftar Pengingat Servis
        </h2>
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari nama, plat, merk..." 
            class="w-full pl-10 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 bg-slate-50/50">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3.5 px-4 text-center">STATUS</th>
              <th class="py-3.5 px-4">PELANGGAN / HP</th>
              <th class="py-3.5 px-4">MOTOR & PLAT</th>
              <th class="py-3.5 px-4">SERVIS TERAKHIR</th>
              <th class="py-3.5 px-4">JADWAL NEXT</th>
              <th class="py-3.5 px-4">SISA WAKTU</th>
              <th class="py-3.5 px-4 text-center">INGATKAN</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i>
                <p>Memuat data pengingat...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // 🔴 URL APPS SCRIPT AKTIF ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqMV2lQsLeG2C70787Qw4zarJWv1023AxZj2XLuo_tUOMSVkash0ZeiXSs14BwqpI4/exec";

    let rawData = [];

    document.addEventListener("DOMContentLoaded", () => {
      muatData();
    });

    function muatData() {
      const tbody = document.getElementById("tableBody");
      const statusText = document.getElementById("statusText");
      
      statusText.innerText = "Memuat data...";
      statusText.className = "text-xs text-amber-600";

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-12 text-center text-slate-400">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i>
            <p>Memuat jadwal dari Spreadsheet...</p>
          </td>
        </tr>`;

      fetch(`${SCRIPT_URL}?t=${new Date().getTime()}`)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            // Filter hanya data yang memiliki TanggalBerikutnya
            rawData = data.filter(item => item.TanggalBerikutnya && item.TanggalBerikutnya.trim() !== "" && item.TanggalBerikutnya !== "-");
            
            statusText.innerText = "Terhubung ke Sheets";
            statusText.className = "text-xs text-emerald-600 font-medium";

            filterTable();
          } else {
            statusText.innerText = "Gagal memuat data";
            statusText.className = "text-xs text-red-500";
            tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Data gagal dimuat.</td></tr>`;
          }
        })
        .catch(err => {
          statusText.innerText = "Gagal terhubung ke Sheets";
          statusText.className = "text-xs text-red-500 font-bold";
          tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Koneksi terputus / gagal memuat data.</td></tr>`;
        });
    }

    function filterTable() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      let filtered = rawData.filter(d => 
        (d.Nama && d.Nama.toLowerCase().includes(q)) ||
        (d.NoPlat && d.NoPlat.toLowerCase().includes(q)) ||
        (d.MerkMotor && d.MerkMotor.toLowerCase().includes(q))
      );

      // Hitung selisih hari & urutkan dari yang paling mendesak (Merah -> Kuning -> Hijau)
      const hariIni = new Date();
      hariIni.setHours(0,0,0,0);

      filtered.forEach(item => {
        const tglNext = new Date(formatTanggalUntukInput(item.TanggalBerikutnya));
        tglNext.setHours(0,0,0,0);
        const diffTime = tglNext - hariIni;
        item.diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      });

      filtered.sort((a, b) => a.diffDays - b.diffDays);

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">Tidak ada data jadwal pengingat servis.</td></tr>`;
        return;
      }

      let html = "";
      data.forEach(item => {
        let statusBadge = "";
        let sisaText = "";

        if (item.diffDays < 0) {
          // TERLEWAT
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Terlewat</span>`;
          sisaText = `<span class="text-red-600 font-bold">Lewat ${Math.abs(item.diffDays)} hari</span>`;
        } else if (item.diffDays <= 7) {
          // HARUS SERVIS (<= 7 Hari)
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700"><i class="fa-solid fa-clock mr-1"></i> Segera</span>`;
          sisaText = item.diffDays === 0 ? `<span class="text-amber-600 font-bold">Hari Ini!</span>` : `<span class="text-amber-600 font-bold">${item.diffDays} hari lagi</span>`;
        } else {
          // AMAN
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> Aman</span>`;
          sisaText = `<span class="text-slate-600">${item.diffDays} hari lagi</span>`;
        }

        // Format No WA
        let noWa = (item.NoHP || "").replace(/[^0-9]/g, "");
        if (noWa.startsWith("0")) noWa = "62" + noWa.slice(1);

        const pesanWA = encodeURIComponent(
          `Halo Kak *${item.Nama}*,\n\nSalam dari *MF.EV Service* ⚡\n` +
          `Pengingat untuk jadwal servis berkala motor *${item.MerkMotor} ${item.TipeMotor || ''}* (${item.NoPlat || '-'}).\n\n` +
          `📅 Tanggal Servis Next: *${formatTanggalDisplay(item.TanggalBerikutnya)}*\n\n` +
          `Yuk lakukan perawatan rutin agar motor listrik Anda tetap dalam kondisi prima. Terima kasih! 🙏`
        );

        html += `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-4 px-4 text-center whitespace-nowrap">${statusBadge}</td>
            <td class="py-4 px-4">
              <div class="font-bold text-slate-900">${item.Nama || '-'}</div>
              <div class="text-xs text-slate-400">${item.NoHP || '-'}</div>
            </td>
            <td class="py-4 px-4">
              <div class="font-medium text-slate-800">${item.MerkMotor || '-'} ${item.TipeMotor || ''}</div>
              <div class="text-xs text-slate-400">Plat: ${item.NoPlat || '-'}</div>
            </td>
            <td class="py-4 px-4 text-xs text-slate-500 whitespace-nowrap">${formatTanggalDisplay(item.Tanggal)}</td>
            <td class="py-4 px-4 font-semibold text-slate-800 whitespace-nowrap">${formatTanggalDisplay(item.TanggalBerikutnya)}</td>
            <td class="py-4 px-4 text-xs whitespace-nowrap">${sisaText}</td>
            <td class="py-4 px-4 text-center whitespace-nowrap">
              ${noWa ? `
                <a href="https://wa.me/${noWa}?text=${pesanWA}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-medium transition-all shadow-sm">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Kirim WA
                </a>
              ` : `<span class="text-xs text-slate-300">Tanpa No HP</span>`}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function formatTanggalUntukInput(str) {
      if (!str) return "";
      if (str.includes("T")) str = str.split("T")[0];
      if (str.includes("/")) {
        const p = str.split("/");
        if (p.length === 3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
      if (str.includes("-")) {
        const p = str.split("-");
        if (p[0].length === 4) return str; 
        if (p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
      return str;
    }

    function formatTanggalDisplay(str) {
      if (!str) return "-";
      const iso = formatTanggalUntukInput(str);
      const p = iso.split("-");
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return str;
    }
  </script>
</body>
</html>
