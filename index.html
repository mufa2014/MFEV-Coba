<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF.EV SERVICE — Riwayat Servis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
        .header-bar { background-color: #1E293B; }
        .card-container { background-color: #1E293B; border-radius: 12px; }
        .divider { border-bottom: 1px solid #334155; }
        .btn-edit { background-color: #F59E0B; color: #000; }
        .btn-hapus { background-color: #EF4444; color: #fff; }
        .btn-edit:hover { background-color: #D97706; }
        .btn-hapus:hover { background-color: #DC2626; }
        input::placeholder { color: #94A3B8; }
    </style>
</head>
<body class="pb-10">

<!-- Header -->
<header class="header-bar px-4 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="logo-mfev.png" alt="MF.EV Logo" class="w-12 h-12 rounded-full bg-white p-1">
            <div>
                <h1 class="text-xl font-bold">MF.EV SERVICE</h1>
                <p class="text-sm text-gray-400">Sistem Pencatatan & Pengingat Servis</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="tarikDataDariSheets()" class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center text-lg" title="Muat Ulang">🔄</button>
            <a href="pengingat.html" class="w-10 h-10 bg-yellow-600 rounded-full flex items-center justify-center text-lg" title="Pengingat">🔔</a>
            <button onclick="bukaForm()" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-xl font-bold" title="Tambah Data">+</button>
        </div>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 mt-6">

    <!-- Kotak Pencarian & Status -->
    <div class="card-container p-4 mb-6">
        <input type="text" id="cari" placeholder="🔍 Cari nama, plat, merk..." 
            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500" oninput="filterData()">
        <p id="statusInfo" class="text-sm text-green-400 mt-2">⏳ Memuat data...</p>
    </div>

    <!-- Daftar Riwayat Servis -->
    <div class="card-container p-4">
        <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
            📋 Riwayat Servis Pelanggan
        </h2>
        <div id="daftarData">
            <p class="text-gray-400 text-center py-6">Memuat data...</p>
        </div>
    </div>

</main>

<!-- Form Tambah/Edit Modal -->
<div id="formModal" class="fixed inset-0 bg-black/70 hidden z-50 overflow-y-auto">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="card-container p-6 w-full max-w-md">
            <h3 id="formJudul" class="text-xl font-bold mb-5">Tambah Servis Baru</h3>
            <form id="formInput" class="space-y-4">
                <input type="hidden" id="editRowId">
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Tanggal Servis</label>
                    <input type="date" id="fTanggal" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nama Pelanggan</label>
                    <input type="text" id="fNama" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nomor HP</label>
                    <input type="tel" id="fNoHP" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Merk Motor</label>
                        <input type="text" id="fMerk" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Tipe Motor</label>
                        <input type="text" id="fTipe" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Nomor Plat</label>
                        <input type="text" id="fNoPlat" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Kilometer</label>
                        <input type="number" id="fKM" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Rincian Pekerjaan</label>
                    <textarea id="fRincian" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Total Biaya (Rp)</label>
                    <input type="number" id="fBiaya" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Tanggal Servis Berikutnya</label>
                    <input type="date" id="fTglBerikutnya" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Catatan</label>
                    <textarea id="fCatatan" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="tutupForm()" class="flex-1 bg-slate-600 py-2 rounded text-sm hover:bg-slate-500">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 py-2 rounded text-sm hover:bg-blue-500">💾 Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbwBM1LwGMmGqaKvb6M8muJrsA0CjANmibC4BeQgTPEgxUtyvppdxiNf2f6c6J6h1TUS/exec";
let daftarData = [];
let semuaData = [];

window.onload = function() {
    tarikDataDariSheets();
};

// === UBAH FORMAT TANGGAL KE DD/MM/YYYY ===
function formatTanggalKeTampilan(t) {
    if (!t) return '-';
    let s = String(t).replace(/T.*/, '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const [y, m, d] = s.split('-');
        return `${d}/${m}/${y}`;
    }
    return s;
}

// === AMBIL DATA DARI SHEETS ===
function tarikDataDariSheets() {
    document.getElementById('statusInfo').textContent = '⏳ Mengambil data...';
    
    fetch(URL_GOOGLE_SHEETS + "?t=" + Date.now(), { cache: "no-store" })
    .then(res => res.json())
    .then(res => {
        let rawList = [];
        if (Array.isArray(res)) rawList = res;
        else if (res.data && Array.isArray(res.data)) rawList = res.data;

        semuaData = rawList.map((item, idx) => ({
            rowId: Number(item.rowId || idx + 2),
            Tanggal: item.Tanggal || '',
            Nama: item.Nama || '',
            NoHP: item.NoHP || '',
            MerkMotor: item.MerkMotor || '',
            TipeMotor: item.TipeMotor || '',
            NoPlat: item.NoPlat || '',
            Kilometer: item.Kilometer || '',
            RincianPekerjaan: item.RincianPekerjaan || '',
            TotalBiaya: item.TotalBiaya || '',
            Catatan: item.Catatan || '',
            TanggalBerikutnya: item.TanggalBerikutnya || ''
        }));

        // ✅ URUTKAN: TANGGAL TERBARU DI ATAS
        semuaData.sort((a, b) => {
            const dateA = new Date(a.Tanggal);
            const dateB = new Date(b.Tanggal);
            return dateB - dateA;
        });

        daftarData = [...semuaData];
        document.getElementById('statusInfo').textContent = `✅ ${daftarData.length} data dimuat`;
        tampilkanRiwayat(daftarData);
    })
    .catch(err => {
        document.getElementById('statusInfo').textContent = '❌ Gagal terhubung';
        console.error(err);
    });
}

// === TAMPILKAN DATA KE LAYAR ===
function tampilkanRiwayat(data) {
    const wadah = document.getElementById('daftarData');
    if (!data.length) {
        wadah.innerHTML = '<p class="text-gray-400 text-center py-6">Belum ada data.</p>';
        return;
    }

    wadah.innerHTML = data.map(item => `
        <div class="py-4 divider">
            <div class="text-gray-400 text-sm mb-2">${formatTanggalKeTampilan(item.Tanggal)}</div>
            <div class="text-lg font-semibold">${item.Nama || '-'}</div>
            <div class="text-sm text-gray-400 mb-2">${item.NoHP || ''}</div>
            <div>${item.MerkMotor || '-'} ${item.TipeMotor || ''}</div>
            <div class="text-sm text-gray-400">Plat: ${item.NoPlat || '-'}</div>
            <div class="mt-1">${item.Kilometer || '-'} Km</div>
            <div class="text-sm mt-1">${item.RincianPekerjaan || '-'}</div>
            <div class="flex gap-3 mt-3">
                <button onclick="bukaEditForm(${item.rowId})" class="btn-edit px-4 py-1.5 rounded text-sm font-medium">✏️ Edit</button>
                <button onclick="hapusData(${item.rowId})" class="btn-hapus px-4 py-1.5 rounded text-sm font-medium">🗑️ Hapus</button>
            </div>
        </div>
    `).join('');
}

// === PENCARIAN ===
function filterData() {
    const kataKunci = document.getElementById('cari').value.toLowerCase().trim();
    if (!kataKunci) {
        daftarData = [...semuaData];
        tampilkanRiwayat(daftarData);
        return;
    }
    daftarData = semuaData.filter(item => {
        return String(item.Nama || '').toLowerCase().includes(kataKunci) ||
               String(item.NoPlat || '').toLowerCase().includes(kataKunci) ||
               String(item.MerkMotor || '').toLowerCase().includes(kataKunci) ||
               String(item.TipeMotor || '').toLowerCase().includes(kataKunci);
    });
    tampilkanRiwayat(daftarData);
}

// === BUKA FORM TAMBAH ===
function bukaForm() {
    document.getElementById('formJudul').textContent = 'Tambah Servis Baru';
    document.getElementById('formInput').reset();
    document.getElementById('editRowId').value = '';
    document.getElementById('fTanggal').valueAsDate = new Date();
    document.getElementById('formModal').classList.remove('hidden');
}

// === BUKA FORM EDIT ===
function bukaEditForm(id) {
    const item = semuaData.find(d => d.rowId === id);
    if (!item) return;
    
    document.getElementById('formJudul').textContent = 'Edit Data Servis';
    document.getElementById('editRowId').value = id;
    document.getElementById('fTanggal').value = item.Tanggal || '';
    document.getElementById('fNama').value = item.Nama || '';
    document.getElementById('fNoHP').value = item.NoHP || '';
    document.getElementById('fMerk').value = item.MerkMotor || '';
    document.getElementById('fTipe').value = item.TipeMotor || '';
    document.getElementById('fNoPlat').value = item.NoPlat || '';
    document.getElementById('fKM').value = item.Kilometer || '';
    document.getElementById('fRincian').value = item.RincianPekerjaan || '';
    document.getElementById('fBiaya').value = item.TotalBiaya || '';
    document.getElementById('fTglBerikutnya').value = item.TanggalBerikutnya || '';
    document.getElementById('fCatatan').value = item.Catatan || '';
    document.getElementById('formModal').classList.remove('hidden');
}

// === TUTUP FORM ===
function tutupForm() {
    document.getElementById('formModal').classList.add('hidden');
}

// === SIMPAN DATA (TAMBAH/EDIT) ===
document.getElementById('formInput').addEventListener('submit', async function(e) {
    e.preventDefault();
    const rowId = document.getElementById('editRowId').value;
    
    const payload = {
        Tanggal: document.getElementById('fTanggal').value,
        Nama: document.getElementById('fNama').value,
        NoHP: document.getElementById('fNoHP').value,
        MerkMotor: document.getElementById('fMerk').value,
        TipeMotor: document.getElementById('fTipe').value,
        NoPlat: document.getElementById('fNoPlat').value,
        Kilometer: document.getElementById('fKM').value,
        RincianPekerjaan: document.getElementById('fRincian').value,
        TotalBiaya: document.getElementById('fBiaya').value,
        TanggalBerikutnya: document.getElementById('fTglBerikutnya').value,
        Catatan: document.getElementById('fCatatan').value
    };

    if (rowId) {
        payload.action = "update";
        payload.rowId = Number(rowId);
    }

    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        alert('✅ Tersimpan ke Google Sheets!');
        tutupForm();
        tarikDataDariSheets();
    } catch (err) {
        alert('⚠️ Gagal tersimpan. Coba lagi ya.');
    }
});

// === HAPUS DATA ===
async function hapusData(id) {
    if (!confirm('Yakin ingin menghapus data ini? Tindakan ini tidak bisa dibatalkan.')) return;
    
    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "hapus", rowId: id })
        });
        alert('✅ Data berhasil dihapus!');
        tarikDataDariSheets();
    } catch (err) {
        alert('⚠️ Gagal menghapus data.');
    }
}
</script>
</body>
</html>
