<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MF.EV Service System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm w-full">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500 text-white p-2.5 rounded-xl font-bold flex items-center justify-center shadow-md shadow-amber-500/20">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-slate-900 leading-tight">MF.EV SERVICE</h1>
          <p class="text-xs text-slate-500">Sistem Pencatatan & Pengingat Servis</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <a href="pengingat.html" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3 py-2 sm:px-4 rounded-xl font-medium text-xs sm:text-sm flex items-center gap-2 transition-all">
          <i class="fa-solid fa-bell text-amber-600"></i>
          <span class="hidden sm:inline">Jadwal Pengingat</span>
        </a>
        <button onclick="bukaModalTambah()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 sm:px-4 rounded-xl font-medium text-xs sm:text-sm flex items-center gap-2 transition-all shadow-sm">
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">Tambah Transaksi</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-4">

    <!-- TABLE CONTAINER -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden w-full">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-base sm:text-lg">
          <i class="fa-solid fa-list-check text-emerald-600"></i>
          <span>Riwayat Servis Pelanggan</span>
        </div>
        
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari nama, plat, merk..." 
            class="w-full pl-10 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 bg-slate-50/50">
        </div>
      </div>

      <!-- TABLE AREA -->
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left text-sm text-slate-600 min-w-[900px]">
          <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3.5 px-4">TANGGAL</th>
              <th class="py-3.5 px-4">PELANGGAN</th>
              <th class="py-3.5 px-4">KENDARAAN</th>
              <th class="py-3.5 px-4">KM</th>
              <th class="py-3.5 px-4">RINCIAN PEKERJAAN</th>
              <th class="py-3.5 px-4">TOTAL BIAYA</th>
              <th class="py-3.5 px-4 text-center">AKSI</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i>
                <p>Memuat data transaksi...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL FORM (TAMBAH / EDIT DATA) -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-100">
      
      <!-- MODAL HEADER -->
      <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 id="modalTitle" class="font-bold text-slate-900 text-base sm:text-lg">Tambah Transaksi Servis</h3>
        <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-all">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- MODAL BODY -->
      <div class="p-4 sm:p-6 overflow-y-auto space-y-4">
        <input type="hidden" id="rowId">

        <!-- ROW 1: Tanggal & KM -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tanggal Servis</label>
            <input type="date" id="inputTanggal" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Kilometer (KM)</label>
            <input type="text" id="inputKilometer" placeholder="Contoh: 12.500" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
        </div>

        <!-- ROW 2: Nama & No HP -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Pelanggan</label>
            <input type="text" id="inputNama" placeholder="Nama Pemilik" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">No. WhatsApp / HP</label>
            <input type="text" id="inputNoHP" placeholder="08xxxxxxxxxx" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
        </div>

        <!-- ROW 3: Merk, Tipe, Plat -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Merk Motor</label>
            <input type="text" id="inputMerkMotor" placeholder="Uwinfly, Gesits, dll." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tipe Motor</label>
            <input type="text" id="inputTipeMotor" placeholder="T3, G1, dll." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">No. Plat Motor</label>
            <input type="text" id="inputNoPlat" placeholder="B 1234 ABC" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
        </div>

        <!-- ROW 4: RINCIAN PEKERJAAN & BIAYA (SESUAI DESAIN FOTO KEDUA) -->
        <div class="space-y-3 pt-2">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wide">Rincian Pekerjaan &amp; Biaya</label>

          <div class="space-y-2" id="itemPekerjaanContainer">
            <!-- Row 1 -->
            <div class="flex gap-2 items-center row-pekerjaan">
              <input type="text" class="input-jasa flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="1. Jasa / Sparepart">
              <input type="number" class="input-biaya w-32 px-3 py-2 border border-slate-200 rounded-xl text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="0" oninput="hitungTotalBiaya()">
            </div>
            <!-- Row 2 -->
            <div class="flex gap-2 items-center row-pekerjaan">
              <input type="text" class="input-jasa flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="2. Jasa / Sparepart">
              <input type="number" class="input-biaya w-32 px-3 py-2 border border-slate-200 rounded-xl text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="0" oninput="hitungTotalBiaya()">
            </div>
            <!-- Row 3 -->
            <div class="flex gap-2 items-center row-pekerjaan">
              <input type="text" class="input-jasa flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="3. Jasa / Sparepart">
              <input type="number" class="input-biaya w-32 px-3 py-2 border border-slate-200 rounded-xl text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="0" oninput="hitungTotalBiaya()">
            </div>
            <!-- Row 4 -->
            <div class="flex gap-2 items-center row-pekerjaan">
              <input type="text" class="input-jasa flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="4. Jasa / Sparepart">
              <input type="number" class="input-biaya w-32 px-3 py-2 border border-slate-200 rounded-xl text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="0" oninput="hitungTotalBiaya()">
            </div>
            <!-- Row 5 -->
            <div class="flex gap-2 items-center row-pekerjaan">
              <input type="text" class="input-jasa flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="5. Jasa / Sparepart">
              <input type="number" class="input-biaya w-32 px-3 py-2 border border-slate-200 rounded-xl text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500" placeholder="0" oninput="hitungTotalBiaya()">
            </div>
          </div>

          <!-- TOTAL BIAYA BOX -->
          <div class="flex items-center justify-between p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl mt-3">
            <span class="font-bold text-slate-800 text-sm tracking-wide uppercase">Total Biaya</span>
            <span id="displayTotalBiaya" class="font-extrabold text-emerald-600 text-lg">Rp 0</span>
          </div>
        </div>

        <!-- ROW 5: Catatan & Tanggal Berikutnya -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Catatan Tambahan</label>
            <input type="text" id="inputCatatan" placeholder="Catatan teknisi..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Jadwal Servis Berikutnya</label>
            <input type="date" id="inputTanggalBerikutnya" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
          </div>
        </div>

      </div>

      <!-- MODAL FOOTER -->
      <div class="p-4 sm:p-5 border-t border-slate-100 bg-slate-50/50 flex justify-end gap-2">
        <button onclick="tutupModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-100 transition-all">
          Batal
        </button>
        <button id="btnSimpan" onclick="simpanData()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-floppy-disk"></i> Simpan
        </button>
      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqMV2lQsLeG2C70787Qw4zarJWv1023AxZj2XLuo_tUOMSVkash0ZeiXSs14BwqpI4/exec";
    let rawData = [];

    document.addEventListener("DOMContentLoaded", function() {
      muatData();
    });

    function formatNoHP(val) {
      if (!val) return "";
      let hp = String(val).trim().replace(/[^0-9]/g, "");
      if (hp.startsWith("8")) hp = "0" + hp;
      return hp;
    }

    function muatData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i><p>Memuat data dari Spreadsheet...</p></td></tr>';

      fetch(SCRIPT_URL + "?t=" + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            rawData = data;
            renderTable(rawData);
          } else {
            tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-red-500 font-semibold">Gagal memuat data.</td></tr>';
          }
        })
        .catch(err => {
          tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-500">Gagal terhubung ke server/spreadsheet.</td></tr>';
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">Belum ada data transaksi.</td></tr>';
        return;
      }

      let html = "";
      data.forEach(item => {
        const hpFormatted = formatNoHP(item.NoHP);
        const totalBiayaNum = parseFloat(item.TotalBiaya) || 0;

        html += `<tr class="hover:bg-slate-50/80 transition-colors">
          <td class="py-4 px-4 text-xs font-medium text-slate-500 whitespace-nowrap">${formatTanggalDisplay(item.Tanggal)}</td>
          <td class="py-4 px-4">
            <div class="font-bold text-slate-900 flex items-center gap-1.5">
              ${item.Nama || '-'}
              ${hpFormatted ? `<button onclick="simpanKontakVCF('${item.Nama || 'Pelanggan MFEV'}', '${hpFormatted}')" title="Simpan ke Kontak HP" class="text-slate-400 hover:text-emerald-600 text-xs p-1"><i class="fa-solid fa-user-plus"></i></button>` : ''}
            </div>
            <div class="text-xs text-slate-500 font-mono">${hpFormatted || '-'}</div>
          </td>
          <td class="py-4 px-4">
            <div class="font-medium text-slate-800">${item.MerkMotor || '-'} ${item.TipeMotor || ''}</div>
            <div class="text-xs text-slate-400">Plat: ${item.NoPlat || '-'}</div>
          </td>
          <td class="py-4 px-4 text-xs font-mono text-slate-600">${item.Kilometer || '-'}</td>
          <td class="py-4 px-4 text-xs text-slate-600 max-w-xs truncate" title="${item.RincianPekerjaan || ''}">${item.RincianPekerjaan || '-'}</td>
          <td class="py-4 px-4 font-bold text-emerald-600 text-xs whitespace-nowrap">Rp ${totalBiayaNum.toLocaleString('id-ID')}</td>
          <td class="py-4 px-4 text-center whitespace-nowrap">
            <div class="flex items-center justify-center gap-1">
              <button onclick="editRow(${item.rowId})" title="Edit Data" class="p-2 text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="hapusRow(${item.rowId})" title="Hapus Data" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </td>
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    // PENELUSURAN REALTIME PADA TABEL
    function filterTable() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = rawData.filter(d => 
        (d.Nama && d.Nama.toLowerCase().includes(q)) ||
        (d.NoHP && String(d.NoHP).toLowerCase().includes(q)) ||
        (d.NoPlat && d.NoPlat.toLowerCase().includes(q)) ||
        (d.MerkMotor && d.MerkMotor.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    // HITUNG TOTAL BIAYA DARI 5 INPUT BIAYA
    function hitungTotalBiaya() {
      let total = 0;
      document.querySelectorAll('.input-biaya').forEach(input => {
        total += parseFloat(input.value) || 0;
      });
      document.getElementById('displayTotalBiaya').innerText = "Rp " + total.toLocaleString('id-ID');
      return total;
    }

    // EXTRACT DATA RINCIAN PEKERJAAN
    function getRincianPekerjaanData() {
      let arrayRincian = [];
      document.querySelectorAll('.row-pekerjaan').forEach(row => {
        const jasa = row.querySelector('.input-jasa').value.trim();
        const biaya = parseFloat(row.querySelector('.input-biaya').value) || 0;
        if (jasa !== "") {
          arrayRincian.push(`${jasa} (Rp ${biaya.toLocaleString('id-ID')})`);
        }
      });
      return {
        rincianTeks: arrayRincian.join(", "),
        totalBiaya: hitungTotalBiaya()
      };
    }

    // SIMPAN / TAMBAH DATA BARU
    function simpanData() {
      const btnSimpan = document.getElementById("btnSimpan");
      const rowId = document.getElementById("rowId").value;
      const dataPekerjaan = getRincianPekerjaanData();

      const payload = {
        action: rowId ? "update" : "create",
        rowId: rowId || "",
        Tanggal: document.getElementById("inputTanggal").value,
        Kilometer: document.getElementById("inputKilometer").value,
        Nama: document.getElementById("inputNama").value,
        NoHP: document.getElementById("inputNoHP").value,
        MerkMotor: document.getElementById("inputMerkMotor").value,
        TipeMotor: document.getElementById("inputTipeMotor").value,
        NoPlat: document.getElementById("inputNoPlat").value,
        RincianPekerjaan: dataPekerjaan.rincianTeks,
        TotalBiaya: dataPekerjaan.totalBiaya,
        Catatan: document.getElementById("inputCatatan").value,
        TanggalBerikutnya: document.getElementById("inputTanggalBerikutnya").value
      };

      btnSimpan.disabled = true;
      btnSimpan.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Data berhasil disimpan!");
        tutupModal();
        muatData();
      })
      .catch(err => {
        alert("Gagal menyimpan data.");
      })
      .finally(() => {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan';
      });
    }

    // MODAL HANDLERS
    function bukaModalTambah() {
      document.getElementById("modalTitle").innerText = "Tambah Transaksi Servis";
      document.getElementById("rowId").value = "";
      document.getElementById("inputTanggal").value = new Date().toISOString().split("T")[0];
      document.getElementById("inputKilometer").value = "";
      document.getElementById("inputNama").value = "";
      document.getElementById("inputNoHP").value = "";
      document.getElementById("inputMerkMotor").value = "";
      document.getElementById("inputTipeMotor").value = "";
      document.getElementById("inputNoPlat").value = "";
      document.getElementById("inputCatatan").value = "";
      document.getElementById("inputTanggalBerikutnya").value = "";

      // Reset Rincian Pekerjaan
      document.querySelectorAll('.input-jasa').forEach(i => i.value = "");
      document.querySelectorAll('.input-biaya').forEach(i => i.value = "");
      hitungTotalBiaya();

      document.getElementById("modalForm").classList.remove("hidden");
    }

    function editRow(rowId) {
      const item = rawData.find(d => Number(d.rowId) === Number(rowId));
      if (!item) return;

      document.getElementById("modalTitle").innerText = "Edit Transaksi Servis";
      document.getElementById("rowId").value = item.rowId;
      document.getElementById("inputTanggal").value = formatTanggalUntukInput(item.Tanggal);
      document.getElementById("inputKilometer").value = item.Kilometer || "";
      document.getElementById("inputNama").value = item.Nama || "";
      document.getElementById("inputNoHP").value = formatNoHP(item.NoHP);
      document.getElementById("inputMerkMotor").value = item.MerkMotor || "";
      document.getElementById("inputTipeMotor").value = item.TipeMotor || "";
      document.getElementById("inputNoPlat").value = item.NoPlat || "";
      document.getElementById("inputCatatan").value = item.Catatan || "";
      document.getElementById("inputTanggalBerikutnya").value = formatTanggalUntukInput(item.TanggalBerikutnya);

      // Populate 5 Input Pekerjaan
      document.querySelectorAll('.input-jasa').forEach(i => i.value = "");
      document.querySelectorAll('.input-biaya').forEach(i => i.value = "");

      if (item.RincianPekerjaan) {
        const items = item.RincianPekerjaan.split(",");
        const rows = document.querySelectorAll('.row-pekerjaan');
        items.forEach((txt, idx) => {
          if (rows[idx]) {
            const match = txt.trim().match(/^(.*?)\s*\(Rp\s*([\d.]+)\)$/);
            if (match) {
              rows[idx].querySelector('.input-jasa').value = match[1];
              rows[idx].querySelector('.input-biaya').value = match[2].replace(/\./g, '');
            } else {
              rows[idx].querySelector('.input-jasa').value = txt.trim();
            }
          }
        });
      }
      hitungTotalBiaya();

      document.getElementById("modalForm").classList.remove("hidden");
    }

    function hapusRow(rowId) {
      if (!confirm("Apakah Anda yakin ingin menghapus transaksi ini?")) return;

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "hapus", rowId: rowId })
      })
      .then(() => {
        alert("Data berhasil dihapus!");
        muatData();
      })
      .catch(err => alert("Gagal menghapus data."));
    }

    function tutupModal() {
      document.getElementById("modalForm").classList.add("hidden");
    }

    // SIMPAN KONTAK KE FILE .VCF
    function simpanKontakVCF(nama, noHP) {
      if (!noHP) return alert("Nomor HP tidak ada!");
      const formatHP = noHP.startsWith("0") ? "+62" + noHP.substring(1) : noHP;
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${nama} (MF.EV)\nTEL;TYPE=CELL:${formatHP}\nEND:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nama.replace(/[^a-zA-Z0-9]/g, "_") + "_MFEV.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // HELPER FORMAT TANGGAL
    function formatTanggalUntukInput(str) {
      if (!str) return "";
      if (str.includes("T")) str = str.split("T")[0];
      if (str.includes("/")) {
        const p = str.split("/");
        if (p.length === 3) return p[2] + "-" + p[1].padStart(2,'0') + "-" + p[0].padStart(2,'0');
      }
      if (str.includes("-")) {
        const p = str.split("-");
        if (p[0].length === 4) return str; 
        if (p[2].length === 4) return p[2] + "-" + p[1].padStart(2,'0') + "-" + p[0].padStart(2,'0');
      }
      return str;
    }

    function formatTanggalDisplay(str) {
      if (!str) return "-";
      const iso = formatTanggalUntukInput(str);
      const p = iso.split("-");
      if (p.length === 3) return p[2] + "-" + p[1] + "-" + p[0];
      return str;
    }
  </script>
</body>
