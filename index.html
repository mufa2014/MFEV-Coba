<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MF.EV Service Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 text-white p-2 rounded-xl">
          <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">MF.EV Service Manager</h1>
          <p class="text-xs text-slate-500">Sistem Riwayat Servis Pelanggan</p>
        </div>
      </div>
      <button onclick="bukaModalTambah()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition-all shadow-sm">
        <i class="fa-solid fa-plus"></i> Tambah Servis
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
    
    <!-- CARD TABLE CONTAINER -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      
      <!-- CARD HEADER & SEARCH BAR -->
      <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-slate-800 font-bold text-lg">
          <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i>
          <span>Riwayat Servis Pelanggan</span>
        </div>
        <div class="relative w-full md:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari nama, plat, merk..." 
            class="w-full pl-10 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 bg-slate-50/50">
        </div>
      </div>

      <!-- TABLE AREA -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3.5 px-4">TGL SERVIS</th>
              <th class="py-3.5 px-4">PELANGGAN / NO. HP</th>
              <th class="py-3.5 px-4">MOTOR & PLAT</th>
              <th class="py-3.5 px-4">RINCIAN PEKERJAAN</th>
              <th class="py-3.5 px-4">TOTAL BIAYA</th>
              <th class="py-3.5 px-4">SERVIS NEXT</th>
              <th class="py-3.5 px-4 text-center">AKSI</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i>
                <p>Memuat data dari Spreadsheet...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <!-- MODAL FORM (TAMBAH / EDIT) -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100">
      
      <div class="p-5 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Tambah Servis Baru</h3>
        <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="servisForm" onsubmit="simpanData(event)" class="p-6 space-y-4">
        <input type="hidden" id="formRowId" value="">
        <input type="hidden" id="formAction" value="create">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Servis *</label>
            <input type="date" id="formTanggal" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Servis Berikutnya</label>
            <input type="date" id="formTanggalBerikutnya" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Pelanggan *</label>
            <input type="text" id="formNama" required placeholder="Contoh: Fajri" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">No. WhatsApp / HP</label>
            <input type="text" id="formNoHP" placeholder="08xxxxxxxxxx" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Merk Motor</label>
            <input type="text" id="formMerkMotor" placeholder="Honda / Yamaha" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipe Motor</label>
            <input type="text" id="formTipeMotor" placeholder="Vario 150 / NMAX" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">No. Plat</label>
            <input type="text" id="formNoPlat" placeholder="BN 1234 XX" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm uppercase">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kilometer (KM)</label>
            <input type="text" id="formKilometer" placeholder="11000 Km" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Total Biaya (Rp)</label>
            <input type="number" id="formTotalBiaya" placeholder="0" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rincian Pekerjaan</label>
          <textarea id="formRincianPekerjaan" rows="2" placeholder="Ganti oli, servis CVT, setel rem..." class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Catatan Tambahan</label>
          <textarea id="formCatatan" rows="2" placeholder="Catatan mekanik / saran penggantian part..." class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 text-sm"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="tutupModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium">Batal</button>
          <button type="submit" id="btnSubmit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2">
            <span>Simpan</span>
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // 🔴 URL APPS SCRIPT LENGKAP MILIK ANDA:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfQZHcjJEPUGgH604OgTdEprdbwg6WEKaSWLBupKcD2htj20PYuy8z2Lczmf_ukJtP/exec";

    let rawData = [];

    document.addEventListener("DOMContentLoaded", () => {
      muatData();
    });

    // 🟢 AMBIL DATA DARI APPS SCRIPT
    function muatData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-12 text-center text-slate-400">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-emerald-600"></i>
            <p>Memuat data dari Spreadsheet...</p>
          </td>
        </tr>`;

      fetch(`${SCRIPT_URL}?t=${new Date().getTime()}`)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            rawData = data;
            renderTable(rawData);
          } else {
            tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Gagal memuat data: ${data.pesan || 'Error tidak diketahui'}</td></tr>`;
          }
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-500">Koneksi terputus / gagal memuat data.</td></tr>`;
        });
    }

    // 🟢 RENDER TABEL
    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">Belum ada riwayat servis.</td></tr>`;
        return;
      }

      let html = "";
      data.forEach(item => {
        const totalRp = Number(item.TotalBiaya || 0).toLocaleString("id-ID");
        const tglDisplay = formatTanggalDisplay(item.Tanggal);
        const tglNextDisplay = item.TanggalBerikutnya ? formatTanggalDisplay(item.TanggalBerikutnya) : "-";

        html += `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="py-4 px-4 whitespace-nowrap font-medium text-slate-700">${tglDisplay}</td>
            <td class="py-4 px-4">
              <div class="font-bold text-slate-900">${item.Nama || '-'}</div>
              <div class="text-xs text-slate-400">${item.NoHP || '-'}</div>
            </td>
            <td class="py-4 px-4">
              <div class="font-medium text-slate-800">${item.MerkMotor || '-'} ${item.TipeMotor || ''}</div>
              <div class="text-xs text-slate-400">Plat: ${item.NoPlat || '-'} | KM: ${item.Kilometer || '-'}</div>
            </td>
            <td class="py-4 px-4 max-w-xs truncate text-slate-600">${item.RincianPekerjaan || '-'}</td>
            <td class="py-4 px-4 font-bold text-emerald-600 whitespace-nowrap">Rp ${totalRp}</td>
            <td class="py-4 px-4 text-xs text-slate-500 whitespace-nowrap">${tglNextDisplay}</td>
            <td class="py-4 px-4 text-center whitespace-nowrap">
              <div class="flex items-center justify-center gap-1">
                <button onclick="cetakStruk(${item.rowId})" title="Cetak Nota" class="p-2 text-slate-500 hover:text-emerald-600 hover:bg-slate-100 rounded-lg transition-all">
                  <i class="fa-solid fa-print"></i>
                </button>
                <button onclick="editRow(${item.rowId})" title="Edit Data" class="p-2 text-slate-500 hover:text-amber-600 hover:bg-slate-100 rounded-lg transition-all">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="hapusRow(${item.rowId})" title="Hapus Data" class="p-2 text-slate-500 hover:text-red-600 hover:bg-slate-100 rounded-lg transition-all">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 🔍 FILTER/SEARCH
    function filterTable() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = rawData.filter(d => 
        (d.Nama && d.Nama.toLowerCase().includes(q)) ||
        (d.NoPlat && d.NoPlat.toLowerCase().includes(q)) ||
        (d.MerkMotor && d.MerkMotor.toLowerCase().includes(q)) ||
        (d.RincianPekerjaan && d.RincianPekerjaan.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    // 🗓️ CONVERT TANGGAL UNTUK INPUT DATE (YYYY-MM-DD) TANPA BERKURANG 1 HARI
    function formatTanggalUntukInput(str) {
      if (!str) return "";
      if (str.includes("T")) str = str.split("T")[0];
      
      // Jika format DD/MM/YYYY
      if (str.includes("/")) {
        const p = str.split("/");
        if (p.length === 3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
      // Jika format YYYY-MM-DD
      if (str.includes("-")) {
        const p = str.split("-");
        if (p[0].length === 4) return str; 
        if (p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
      return str;
    }

    // 🗓️ FORMAT TANGGAL TAMPILAN TABEL (DD-MM-YYYY)
    function formatTanggalDisplay(str) {
      if (!str) return "-";
      const iso = formatTanggalUntukInput(str);
      const p = iso.split("-");
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return str;
    }

    // ➕ OPEN MODAL TAMBAH
    function bukaModalTambah() {
      document.getElementById("servisForm").reset();
      document.getElementById("modalTitle").innerText = "Tambah Servis Baru";
      document.getElementById("formRowId").value = "";
      document.getElementById("formAction").value = "create";
      
      // Default tanggal hari ini
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("formTanggal").value = today;
      
      document.getElementById("modalForm").classList.remove("hidden");
    }

    // ✏️ OPEN MODAL EDIT
    function editRow(rowId) {
      const item = rawData.find(d => Number(d.rowId) === Number(rowId));
      if (!item) return;

      document.getElementById("modalTitle").innerText = "Edit Servis Pelanggan";
      document.getElementById("formRowId").value = item.rowId;
      document.getElementById("formAction").value = "update";

      // Set value presisi tanpa pergeseran tanggal
      document.getElementById("formTanggal").value = formatTanggalUntukInput(item.Tanggal);
      document.getElementById("formTanggalBerikutnya").value = formatTanggalUntukInput(item.TanggalBerikutnya);
      
      document.getElementById("formNama").value = item.Nama || "";
      document.getElementById("formNoHP").value = item.NoHP || "";
      document.getElementById("formMerkMotor").value = item.MerkMotor || "";
      document.getElementById("formTipeMotor").value = item.TipeMotor || "";
      document.getElementById("formNoPlat").value = item.NoPlat || "";
      document.getElementById("formKilometer").value = item.Kilometer || "";
      document.getElementById("formTotalBiaya").value = item.TotalBiaya || 0;
      document.getElementById("formRincianPekerjaan").value = item.RincianPekerjaan || "";
      document.getElementById("formCatatan").value = item.Catatan || "";

      document.getElementById("modalForm").classList.remove("hidden");
    }

    function tutupModal() {
      document.getElementById("modalForm").classList.add("hidden");
    }

    // 💾 SIMPAN DATA (CREATE / UPDATE)
    function simpanData(e) {
      e.preventDefault();

      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

      const action = document.getElementById("formAction").value;
      const rowId = document.getElementById("formRowId").value;

      const payload = {
        action: action,
        rowId: rowId,
        Tanggal: document.getElementById("formTanggal").value,
        Nama: document.getElementById("formNama").value,
        NoHP: document.getElementById("formNoHP").value,
        MerkMotor: document.getElementById("formMerkMotor").value,
        TipeMotor: document.getElementById("formTipeMotor").value,
        NoPlat: document.getElementById("formNoPlat").value,
        Kilometer: document.getElementById("formKilometer").value,
        RincianPekerjaan: document.getElementById("formRincianPekerjaan").value,
        TotalBiaya: document.getElementById("formTotalBiaya").value,
        Catatan: document.getElementById("formCatatan").value,
        TanggalBerikutnya: document.getElementById("formTanggalBerikutnya").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(action === "update" ? "Data berhasil diperbarui!" : "Data berhasil disimpan!");
        tutupModal();
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Simpan</span>`;
        muatData(); // Refresh tabel
      })
      .catch(err => {
        alert("Gagal menyimpan data: " + err.message);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Simpan</span>`;
      });
    }

    // 🗑️ HAPUS ROW
    function hapusRow(rowId) {
      const item = rawData.find(d => Number(d.rowId) === Number(rowId));
      if (!item) return;

      if (!confirm(`Hapus data servis untuk ${item.Nama} (${item.NoPlat || 'Tanpa Plat'})?`)) return;

      const payload = {
        action: "hapus",
        rowId: rowId,
        nama: item.Nama,
        tanggal: item.Tanggal,
        plat: item.NoPlat
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Data berhasil dihapus dari Google Sheets!");
        muatData();
      })
      .catch(err => alert("Gagal menghapus: " + err.message));
    }

    // 🖨️ CETAK NOTA / STRUK
    function cetakStruk(rowId) {
      const item = rawData.find(d => Number(d.rowId) === Number(rowId));
      if (!item) return;

      const totalRp = Number(item.TotalBiaya || 0).toLocaleString("id-ID");
      const cetakWin = window.open("", "_blank", "width=600,height=700");
      
      cetakWin.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Nota Servis - ${item.Nama}</title>
          <style>
            body { font-family: monospace; font-size: 13px; padding: 20px; line-height: 1.4; }
            .header { text-align: center; font-weight: bold; margin-bottom: 15px; border-bottom: 1px dashed #000; padding-bottom: 10px; }
            .row { display: flex; justify-space-between; margin-bottom: 4px; }
            .line { border-bottom: 1px dashed #000; margin: 10px 0; }
            .total { font-weight: bold; font-size: 15px; text-align: right; }
          </style>
        </head>
        <body onload="window.print()">
          <div class="header">
            MF.EV SERVICE CENTER<br>
            Nota Servis Pelanggan
          </div>
          <div>Tanggal  : ${formatTanggalDisplay(item.Tanggal)}</div>
          <div>Nama     : ${item.Nama} (${item.NoHP || '-'})</div>
          <div>Motor    : ${item.MerkMotor} ${item.TipeMotor}</div>
          <div>No. Plat : ${item.NoPlat} | KM: ${item.Kilometer}</div>
          <div class="line"></div>
          <div><b>Pekerjaan / Part:</b></div>
          <div>${item.RincianPekerjaan || '-'}</div>
          <div class="line"></div>
          <div class="total">TOTAL: Rp ${totalRp}</div>
          <div class="line"></div>
          <div style="text-align: center; font-size: 11px;">
            Next Servis: ${item.TanggalBerikutnya ? formatTanggalDisplay(item.TanggalBerikutnya) : '-'}<br>
            Terima kasih atas kunjungan Anda!
          </div>
        </body>
        </html>
      `);
      cetakWin.document.close();
    }
  </script>
</body>
</html>
