<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF.EV Service Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .badge-lewat { background-color: #fee2e2; color: #dc2626; }
        .badge-segera { background-color: #fef3c7; color: #d97706; }
        .badge-aman { background-color: #dcfce7; color: #16a34a; }
    </style>
</head>
<body class="bg-gray-100 max-w-xl mx-auto p-3 text-gray-800" onload="initApp()">

    <!-- HEADER / LOGO -->
    <div class="bg-green-800 text-white p-4 rounded-lg shadow-md mb-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <!-- LOGO BENGKEL -->
            <img src="logo-mfev.png" alt="MF.EV Logo" class="w-12 h-12 rounded-full bg-white p-0.5 object-cover shadow border-2 border-white">
            <div>
                <h1 class="text-xl font-bold leading-tight">MF.EV Service</h1>
                <p class="text-xs text-green-200">Manajemen Bengkel & Riwayat Servis</p>
            </div>
        </div>
        <a href="pengingat.html" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-semibold px-3 py-1.5 rounded text-xs shadow transition">
            🔔 Pengingat
        </a>
    </div>

    <!-- STATUS KONEKSI / INFO -->
    <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow mb-4 text-xs">
        <span id="statusKoneksi" class="font-medium text-gray-600">⏳ Menghubungkan ke Sheets...</span>
        <button onclick="tarikDataDariSheets()" id="btnMuat" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded transition">
            🔄 Muat Ulang
        </button>
    </div>

    <!-- FORM INPUT / EDIT DATA -->
    <div class="bg-white p-4 rounded-lg shadow mb-5">
        <h2 id="judulForm" class="text-base font-bold text-gray-800 border-b pb-2 mb-3">➕ Tambah Transaksi Servis</h2>
        
        <form id="formServis" onsubmit="simpanData(event)" class="space-y-3 text-xs">
            <input type="hidden" id="editRowId" value="">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-semibold mb-1">Tanggal Servis</label>
                    <input type="date" id="inputTanggal" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Nama Pelanggan</label>
                    <input type="text" id="inputNama" required placeholder="Contoh: Fajri" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-semibold mb-1">No HP / WhatsApp</label>
                    <input type="tel" id="inputNoHP" placeholder="087781741595" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Merk Motor EV</label>
                    <input type="text" id="inputMerk" required placeholder="Polytron / Uwinfly" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block font-semibold mb-1">Tipe Motor</label>
                    <input type="text" id="inputTipe" placeholder="Fox R / Fox S" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">No Plat</label>
                    <input type="text" id="inputNoPlat" placeholder="BN-2602-AH" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Kilometer</label>
                    <input type="text" id="inputKilometer" placeholder="11000 Km" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-1">Rincian Pekerjaan & Sparepart</label>
                <textarea id="inputRincian" rows="2" placeholder="Ganti Kampas Rem Depan: Rp 35.000" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-semibold mb-1">Total Biaya (Rp)</label>
                    <input type="text" id="inputTotalBiaya" placeholder="35000" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Tanggal Servis Berikutnya</label>
                    <input type="date" id="inputTanggalBerikutnya" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-1">Catatan Tambahan</label>
                <input type="text" id="inputCatatan" placeholder="Sparepart Bawa Sendiri / Unit Baru" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-600 outline-none">
            </div>

            <div class="flex gap-2 pt-2">
                <button type="submit" id="btnSimpan" class="flex-1 bg-green-700 hover:bg-green-800 text-white py-2 rounded font-bold shadow text-sm transition">
                    💾 Simpan Data
                </button>
                <button type="button" id="btnBatal" onclick="resetForm()" class="hidden bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded font-semibold text-sm transition">
                    Batal
                </button>
            </div>
        </form>
    </div>

    <!-- PANEL FILTER & SORTING -->
    <div class="bg-white p-3 rounded-lg shadow mb-4 text-xs">
        <div class="flex items-center gap-2 mb-2">
            <span class="font-bold text-gray-700">📌 Urutkan Berdasarkan:</span>
        </div>
        <div class="flex flex-wrap gap-1.5">
            <button onclick="setUrutan('tanggal')" id="sortTanggal" class="px-2.5 py-1 rounded bg-green-800 text-white font-medium">Tanggal ⬇</button>
            <button onclick="setUrutan('nama')" id="sortNama" class="px-2.5 py-1 rounded bg-gray-200 text-gray-700 hover:bg-gray-300">Nama A-Z</button>
            <button onclick="setUrutan('merk')" id="sortMerk" class="px-2.5 py-1 rounded bg-gray-200 text-gray-700 hover:bg-gray-300">Merk</button>
            <button onclick="setUrutan('biaya')" id="sortBiaya" class="px-2.5 py-1 rounded bg-gray-200 text-gray-700 hover:bg-gray-300">Biaya ⬇</button>
        </div>
        <div class="mt-2 pt-2 border-t">
            <input type="text" id="inputCari" oninput="filterData()" placeholder="🔍 Cari Nama, No Plat, atau Motor..." class="w-full p-1.5 border rounded outline-none focus:ring-1 focus:ring-blue-500">
        </div>
    </div>

    <!-- TABEL / DAFTAR RIWAYAT SERVIS -->
    <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
        <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
            <h3 class="font-bold text-gray-700 text-xs">📋 Riwayat Transaksi</h3>
            <span id="jumlahData" class="text-xs text-gray-500 font-medium">0 transaksi</span>
        </div>
        <div id="wadahRiwayat" class="divide-y divide-gray-200">
            <!-- Data dimasukkan via JavaScript -->
        </div>
    </div>

<script>
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbwBM1LwGMmGqaKvb6M8muJrsA0CjANmibC4BeQgTPEgxUtyvppdxiNf2f6c6J6h1TUS/exec";

let daftarData = [];
let modeUrut = 'tanggal';
let arahAsc = false;

function initApp() {
    // Set default tanggal hari ini
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('inputTanggal').value = today;
    tarikDataDariSheets();
}

function formatTanggalKeISO(t) {
    if (!t) return '';
    let s = String(t).replace(/T.*/,'').trim();
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
        const [d,m,y] = s.split('/');
        return `${y}-${m}-${d}`;
    }
    return s;
}

function ubahFormatTanggal(t) {
    if (!t) return '';
    let s = String(t).replace(/T.*/,'').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const [y,m,d] = s.split('-');
        return `${d}-${m}-${y}`;
    }
    return s;
}

function formatRupiah(angka) {
    if (!angka) return 'Rp 0';
    let val = String(angka).replace(/\D/g, '');
    return 'Rp ' + Number(val).toLocaleString('id-ID');
}

function tarikDataDariSheets() {
    const statusEl = document.getElementById('statusKoneksi');
    const btnMuat = document.getElementById('btnMuat');
    
    statusEl.textContent = '⏳ Mengambil data...';
    btnMuat.disabled = true;

    // Bersihkan script JSONP lama jika ada
    const scriptLama = document.getElementById('jsonpScript');
    if (scriptLama) scriptLama.remove();

    window.prosesDataSheets = function(res) {
        btnMuat.disabled = false;
        let listRaw = [];
        if (Array.isArray(res)) listRaw = res;
        else if (res && res.data && Array.isArray(res.data)) listRaw = res.data;

        daftarData = listRaw.map((item, idx) => ({
            rowId: Number(item.rowId || idx + 2),
            Tanggal: formatTanggalKeISO(item.Tanggal || ''),
            Nama: item.Nama || '',
            NoHP: String(item.NoHP || ''),
            MerkMotor: item.MerkMotor || '',
            TipeMotor: item.TipeMotor || '',
            NoPlat: item.NoPlat || '',
            Kilometer: item.Kilometer || '',
            RincianPekerjaan: item.RincianPekerjaan || '',
            TotalBiaya: item.TotalBiaya || '',
            Catatan: item.Catatan || '',
            TanggalBerikutnya: formatTanggalKeISO(item.TanggalBerikutnya || ''),
            SudahDihubungi: String(item.SudahDihubungi).toUpperCase() === 'TRUE' || item.SudahDihubungi === true
        }));

        statusEl.textContent = `✅ Terhubung (${daftarData.length} data)`;
        tampilkanRiwayat(daftarData);
    };

    const script = document.createElement('script');
    script.id = 'jsonpScript';
    script.src = `${URL_GOOGLE_SHEETS}?callback=prosesDataSheets&t=${Date.now()}`;
    script.onerror = function() {
        btnMuat.disabled = false;
        statusEl.textContent = '❌ Gagal terhubung ke Sheets';
    };
    document.body.appendChild(script);
}

function setUrutan(kriteria) {
    if (modeUrut === kriteria) {
        arahAsc = !arahAsc;
    } else {
        modeUrut = kriteria;
        arahAsc = (kriteria === 'nama' || kriteria === 'merk');
    }

    // Update style tombol
    ['Tanggal', 'Nama', 'Merk', 'Biaya'].forEach(k => {
        const btn = document.getElementById('sort' + k);
        if (k.toLowerCase() === kriteria) {
            btn.className = "px-2.5 py-1 rounded bg-green-800 text-white font-medium";
            btn.textContent = `${k} ${arahAsc ? '⬆' : '⬇'}`;
        } else {
            btn.className = "px-2.5 py-1 rounded bg-gray-200 text-gray-700 hover:bg-gray-300";
            btn.textContent = k;
        }
    });

    tampilkanRiwayat(daftarData);
}

function filterData() {
    tampilkanRiwayat(daftarData);
}

function tampilkanRiwayat(dataList) {
    const wadah = document.getElementById('wadahRiwayat');
    const inputCari = document.getElementById('inputCari').value.toLowerCase();
    
    // 1. Filter Pencarian
    let hasil = dataList.filter(item => {
        return item.Nama.toLowerCase().includes(inputCari) ||
               item.NoPlat.toLowerCase().includes(inputCari) ||
               item.MerkMotor.toLowerCase().includes(inputCari) ||
               item.TipeMotor.toLowerCase().includes(inputCari);
    });

    // 2. Sorting Data
    hasil.sort((a, b) => {
        let valA, valB;
        if (modeUrut === 'tanggal') {
            valA = new Date(a.Tanggal || '1970-01-01');
            valB = new Date(b.Tanggal || '1970-01-01');
        } else if (modeUrut === 'nama') {
            valA = a.Nama.toLowerCase();
            valB = b.Nama.toLowerCase();
        } else if (modeUrut === 'merk') {
            valA = a.MerkMotor.toLowerCase();
            valB = b.MerkMotor.toLowerCase();
        } else if (modeUrut === 'biaya') {
            valA = Number(String(a.TotalBiaya).replace(/\D/g, '')) || 0;
            valB = Number(String(b.TotalBiaya).replace(/\D/g, '')) || 0;
        }

        if (valA < valB) return arahAsc ? -1 : 1;
        if (valA > valB) return arahAsc ? 1 : -1;
        return 0;
    });

    document.getElementById('jumlahData').textContent = `${hasil.length} transaksi`;

    if (hasil.length === 0) {
        wadah.innerHTML = `<div class="p-4 text-center text-gray-500 italic text-xs">Belum ada riwayat data servis.</div>`;
        return;
    }

    wadah.innerHTML = hasil.map(item => `
        <div class="p-3 hover:bg-gray-50 transition text-xs flex flex-col gap-2">
            <div class="flex justify-between items-start">
                <div>
                    <span class="font-bold text-gray-800 text-sm">${item.Nama}</span>
                    <span class="text-gray-500 text-xs ml-1">(${item.NoHP || '-'})</span>
                    <div class="text-gray-600 font-medium">${item.MerkMotor} ${item.TipeMotor} — <span class="bg-gray-100 px-1.5 py-0.5 rounded border">${item.NoPlat || '-'}</span></div>
                </div>
                <div class="text-right">
                    <div class="font-bold text-green-700 text-sm">${formatRupiah(item.TotalBiaya)}</div>
                    <div class="text-gray-400 text-xs">${ubahFormatTanggal(item.Tanggal)}</div>
                </div>
            </div>

            <div class="bg-gray-50 p-2 rounded border text-gray-700">
                <div class="font-semibold text-gray-800">🛠 Pekerjaan:</div>
                <div>${item.RincianPekerjaan || '-'}</div>
                ${item.Catatan && item.Catatan !== '-' ? `<div class="mt-1 text-gray-500 italic">📌 ${item.Catatan}</div>` : ''}
            </div>

            <div class="flex justify-between items-center pt-1 border-t border-gray-100">
                <div class="text-xs text-gray-500">
                    KM: <span class="font-semibold">${item.Kilometer || '-'}</span> 
                    ${item.TanggalBerikutnya ? `| Next: <span class="font-semibold text-blue-600">${ubahFormatTanggal(item.TanggalBerikutnya)}</span>` : ''}
                </div>
                <div class="flex gap-1.5">
                    <button onclick="cetakStruk('${item.rowId}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded font-medium shadow-sm transition">Struk</button>
                    <button onclick="editData('${item.rowId}')" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded font-medium shadow-sm transition">Edit</button>
                    <button onclick="hapusData('${item.rowId}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded font-medium shadow-sm transition">Hapus</button>
                </div>
            </div>
        </div>
    `).join('');
}

async function simpanData(e) {
    e.preventDefault();
    const rowId = document.getElementById('editRowId').value;
    const isEdit = Boolean(rowId);

    const btnSimpan = document.getElementById('btnSimpan');
    btnSimpan.disabled = true;
    btnSimpan.textContent = '⏳ Menyimpan...';

    const payload = new URLSearchParams({
        action: isEdit ? 'update' : 'insert',
        rowId: rowId,
        Tanggal: ubahFormatTanggal(document.getElementById('inputTanggal').value),
        Nama: document.getElementById('inputNama').value,
        NoHP: document.getElementById('inputNoHP').value,
        MerkMotor: document.getElementById('inputMerk').value,
        TipeMotor: document.getElementById('inputTipe').value,
        NoPlat: document.getElementById('inputNoPlat').value,
        Kilometer: document.getElementById('inputKilometer').value,
        RincianPekerjaan: document.getElementById('inputRincian').value,
        TotalBiaya: formatRupiah(document.getElementById('inputTotalBiaya').value),
        Catatan: document.getElementById('inputCatatan').value,
        TanggalBerikutnya: ubahFormatTanggal(document.getElementById('inputTanggalBerikutnya').value)
    });

    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: payload.toString()
        });

        alert(isEdit ? "Data berhasil diperbarui!" : "Data baru berhasil disimpan!");
        resetForm();
        setTimeout(() => tarikDataDariSheets(), 1200);
    } catch (err) {
        console.error(err);
        alert("Gagal menyimpan data!");
    } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = '💾 Simpan Data';
    }
}

function editData(rowId) {
    const item = daftarData.find(d => String(d.rowId) === String(rowId));
    if (!item) return;

    document.getElementById('editRowId').value = item.rowId;
    document.getElementById('inputTanggal').value = item.Tanggal;
    document.getElementById('inputNama').value = item.Nama;
    document.getElementById('inputNoHP').value = item.NoHP;
    document.getElementById('inputMerk').value = item.MerkMotor;
    document.getElementById('inputTipe').value = item.TipeMotor;
    document.getElementById('inputNoPlat').value = item.NoPlat;
    document.getElementById('inputKilometer').value = item.Kilometer;
    document.getElementById('inputRincian').value = item.RincianPekerjaan;
    document.getElementById('inputTotalBiaya').value = String(item.TotalBiaya).replace(/\D/g, '');
    document.getElementById('inputCatatan').value = item.Catatan;
    document.getElementById('inputTanggalBerikutnya').value = item.TanggalBerikutnya;

    document.getElementById('judulForm').textContent = '✏️ Edit Transaksi Servis';
    document.getElementById('btnSimpan').textContent = '💾 Perbarui Data';
    document.getElementById('btnBatal').classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
    document.getElementById('formServis').reset();
    document.getElementById('editRowId').value = '';
    document.getElementById('judulForm').textContent = '➕ Tambah Transaksi Servis';
    document.getElementById('btnSimpan').textContent = '💾 Simpan Data';
    document.getElementById('btnBatal').classList.add('hidden');
    
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('inputTanggal').value = today;
}

async function hapusData(rowId) {
    const item = daftarData.find(d => String(d.rowId) === String(rowId));
    if (!item) {
        alert("Data tidak ditemukan!");
        return;
    }

    if (!confirm(`Apakah Anda yakin ingin menghapus data servis "${item.Nama}" (${item.MerkMotor}) secara permanen dari Spreadsheet?`)) {
        return;
    }

    const statusEl = document.getElementById('statusKoneksi');
    statusEl.textContent = '⏳ Menghapus dari Spreadsheet...';

    const payload = new URLSearchParams({
        action: 'hapus',
        rowId: item.rowId,
        nama: item.Nama,
        tanggal: ubahFormatTanggal(item.Tanggal),
        plat: item.NoPlat
    });

    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: payload.toString()
        });

        // Hapus langsung dari daftar lokal
        daftarData = daftarData.filter(d => String(d.rowId) !== String(rowId));
        tampilkanRiwayat(daftarData);

        statusEl.textContent = '✅ Berhasil dihapus permanen!';
        
        // Tarik ulang otomatis setelah 1.5 detik untuk sinkronisasi ulang nomor baris
        setTimeout(() => tarikDataDariSheets(), 1500);

    } catch (err) {
        console.error("Gagal menghapus:", err);
        alert("Gagal menghapus data dari Google Sheets!");
    }
}

function cetakStruk(rowId) {
    const item = daftarData.find(d => String(d.rowId) === String(rowId));
    if (!item) return;

    const htmlStruk = `
    <!DOCTYPE html>
    <html>
    <head>
        <title>Struk Servis - ${item.Nama}</title>
        <style>
            body {
                font-family: 'Courier New', Courier, monospace;
                width: 280px;
                margin: 0 auto;
                padding: 10px;
                font-size: 11px;
                color: #000;
            }
            .text-center { text-align: center; }
            .logo { width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 5px auto; display: block; }
            .border-bottom { border-bottom: 1px dashed #000; margin: 8px 0; }
            .bold { font-weight: bold; }
            .flex-between { display: flex; justify-content: space-between; }
            .rincian { white-space: pre-wrap; margin: 5px 0; }
        </style>
    </head>
    <body>
        <div class="text-center">
            <img src="logo-mfev.png" class="logo" alt="Logo MF.EV">
            <div class="bold" style="font-size: 14px;">MF.EV SERVICE</div>
            <div>BENGKEL MOTOR LISTRIK</div>
            <div style="font-size: 9px;">Pangkalpinang, Bangka Belitung</div>
        </div>
        
        <div class="border-bottom"></div>
        
        <div>Tgl     : ${ubahFormatTanggal(item.Tanggal)}</div>
        <div>Nama    : ${item.Nama}</div>
        <div>No HP   : ${item.NoHP || '-'}</div>
        <div>Motor   : ${item.MerkMotor} ${item.TipeMotor}</div>
        <div>Plat    : ${item.NoPlat || '-'}</div>
        <div>KM      : ${item.Kilometer || '-'}</div>
        
        <div class="border-bottom"></div>
        
        <div class="bold">RINCIAN PEKERJAAN & SPAREPART:</div>
        <div class="rincian">${item.RincianPekerjaan || '-'}</div>
        
        <div class="border-bottom"></div>
        
        <div class="flex-between bold" style="font-size: 12px;">
            <span>TOTAL BIAYA:</span>
            <span>${formatRupiah(item.TotalBiaya)}</span>
        </div>
        ${item.Catatan && item.Catatan !== '-' ? `<div style="margin-top: 4px;">Catatan: ${item.Catatan}</div>` : ''}
        
        <div class="border-bottom"></div>
        
        <div class="text-center">
            <div>Jadwal Servis Berkala Berikutnya:</div>
            <div class="bold" style="font-size: 12px; margin-top: 2px;">
                📅 ${item.TanggalBerikutnya ? ubahFormatTanggal(item.TanggalBerikutnya) : 'Sesuai Pemakaian'}
            </div>
        </div>

        <div class="border-bottom"></div>
        
        <div class="text-center" style="margin-top: 10px;">
            Terima Kasih Atas Kepercayaan Anda 🙏
        </div>
    </body>
    </html>
    `;

    const win = window.open('', '_blank', 'width=380,height=600');
    win.document.write(htmlStruk);
    win.document.close();
    win.focus();
    setTimeout(() => { win.print(); }, 600);
}
</script>
</body>
</html>
