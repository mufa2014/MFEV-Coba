<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF.EV Service — Riwayat Servis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #121212; color: #fff; }
        .card { background: #1e1e1e; border-radius: 12px; }
        .row-data:hover { background: #2a2a2a; }
        input, button { outline: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-10 bg-gray-900 shadow-md px-4 py-3">
        <div class="flex items-center justify-between max-w-4xl mx-auto">
            <div class="flex items-center gap-3">
                <img src="logo-mfev.png" alt="MF.EV Logo" class="w-10 h-10 rounded-full bg-white p-1">
                <div>
                    <h1 class="text-lg font-bold">MF.EV SERVICE</h1>
                    <p class="text-xs text-gray-400">Sistem Pencatatan & Pengingat Servis</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="tarikDataDariSheets()" class="bg-green-600 p-2 rounded-full hover:bg-green-700" title="Muat Ulang">🔄</button>
                <a href="pengingat.html" class="bg-yellow-600 p-2 rounded-full hover:bg-yellow-700" title="Pengingat">🔔</a>
                <button onclick="bukaForm()" class="bg-blue-600 p-2 rounded-full hover:bg-blue-700" title="Tambah Data">+</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4">
        <!-- Pencarian -->
        <div class="card p-4 mb-4">
            <input type="text" id="cari" placeholder="🔍 Cari nama, plat, merk..." 
                class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" oninput="filterData()">
            <span id="statusInfo" class="text-xs text-gray-400 mt-2 inline-block"></span>
        </div>

        <!-- Tabel Data -->
        <div class="card p-4 overflow-x-auto">
            <h2 class="text-lg font-semibold mb-3">📋 Riwayat Servis Pelanggan</h2>
            <div id="daftarRiwayat">
                <div class="text-gray-400 italic text-center py-4">Memuat data...</div>
            </div>
        </div>
    </main>

    <!-- Form Modal -->
    <div id="formModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="card p-5 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h3 id="formTitle" class="text-lg font-bold mb-4">Tambah Servis Baru</h3>
            <form id="formData">
                <input type="hidden" id="editRowId">
                <div class="space-y-3">
                    <div>
                        <label class="text-sm text-gray-400">Tanggal</label>
                        <input type="date" id="fTanggal" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">Nama Pelanggan</label>
                        <input type="text" id="fNama" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">No HP</label>
                        <input type="tel" id="fNoHP" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-sm text-gray-400">Merk Motor</label>
                            <input type="text" id="fMerk" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="text-sm text-gray-400">Tipe Motor</label>
                            <input type="text" id="fTipe" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-sm text-gray-400">No Plat</label>
                            <input type="text" id="fNoPlat" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="text-sm text-gray-400">Kilometer</label>
                            <input type="number" id="fKM" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">Rincian Pekerjaan</label>
                        <textarea id="fRincian" rows="2" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">Total Biaya (Rp)</label>
                        <input type="number" id="fBiaya" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">Tanggal Servis Berikutnya</label>
                        <input type="date" id="fTglBerikutnya" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="text-sm text-gray-400">Catatan</label>
                        <textarea id="fCatatan" rows="2" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"></textarea>
                    </div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="tutupForm()" class="flex-1 bg-gray-700 py-2 rounded text-sm">Batal</button>
                    <button type="submit" class="flex-1 bg-blue-600 py-2 rounded text-sm hover:bg-blue-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

<script>
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbwBM1LwGMmGqaKvb6M8muJrsA0CjANmibC4BeQgTPEgxUtyvppdxiNf2f6c6J6h1TUS/exec";
let daftarData = [];

function initApp() {
    tarikDataDariSheets();
}

function formatTanggal(t) {
    if (!t) return '-';
    let s = String(t).replace(/T.*/,'').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const [y,m,d] = s.split('-');
        return `${d}/${m}/${y}`;
    }
    return s;
}

function tarikDataDariSheets() {
    document.getElementById('statusInfo').textContent = '⏳ Mengambil data...';
    
    fetch(URL_GOOGLE_SHEETS + "?t=" + Date.now(), { cache: "no-store" })
    .then(res => res.json())
    .then(res => {
        let rawList = [];
        if (Array.isArray(res)) rawList = res;
        else if (res.data && Array.isArray(res.data)) rawList = res.data;
        
        daftarData = rawList.map((item, idx) => ({
            rowId: Number(item.rowId || idx + 2),
            Tanggal: item.Tanggal || '',
            Nama: item.Nama || '',
            NoHP: item.NoHP || '',
            MerkMotor: item.MerkMotor || '',
            TipeMotor: item.TipeMotor || '',
            NoPlat: item.NoPlat || '',
            Kilometer: item.Kilometer || '',
            RincianPekerjaan: item.RincianPekerjaan || '',
            TotalBiaya: item.TotalBiaya || '',
            Catatan: item.Catatan || '',
            TanggalBerikutnya: item.TanggalBerikutnya || ''
        }));

        // ✅ URUTKAN: TANGGAL TERBARU DI ATAS
        daftarData.sort((a, b) => {
            const dateA = new Date(a.Tanggal);
            const dateB = new Date(b.Tanggal);
            return dateB - dateA;
        });

        document.getElementById('statusInfo').textContent = `✅ ${daftarData.length} data dimuat`;
        tampilkanData(daftarData);
    })
    .catch(err => {
        document.getElementById('statusInfo').textContent = '❌ Gagal terhubung';
    });
}

function tampilkanData(data) {
    const wadah = document.getElementById('daftarRiwayat');
    if (!data.length) {
        wadah.innerHTML = '<div class="text-gray-400 italic text-center py-4">Belum ada data.</div>';
        return;
    }

    wadah.innerHTML = `
    <div class="hidden md:grid grid-cols-6 gap-2 text-xs text-gray-400 font-semibold pb-2 border-b border-gray-700">
        <div>TANGGAL</div><div>PELANGGAN</div><div>KENDARAAN</div><div>KM</div><div>RINCIAN</div><div class="text-right">AKSI</div>
    </div>` + data.map(item => `
    <div class="row-data p-3 border-b border-gray-800 text-sm">
        <div class="md:grid md:grid-cols-6 md:gap-2 md:items-center">
            <div class="text-gray-300 font-medium">${formatTanggal(item.Tanggal)}</div>
            <div class="my-1 md:my-0">
                <div class="font-semibold">${item.Nama || '-'}</div>
                <div class="text-xs text-gray-400">${item.NoHP || ''}</div>
            </div>
            <div class="text-gray-300">
                <div>${item.MerkMotor || '-'} ${item.TipeMotor || ''}</div>
                <div class="text-xs text-gray-400">Plat: ${item.NoPlat || '-'}</div>
            </div>
            <div class="text-gray-300">${item.Kilometer || '-'}</div>
            <div class="text-gray-300 text-xs">${item.RincianPekerjaan || '-'}</div>
            <div class="flex gap-2 mt-2 md:mt-0 md:justify-end">
                <button onclick="editData(${item.rowId})" class="bg-amber-600 text-white px-2 py-1 rounded text-xs">✏️ Edit</button>
                <button onclick="hapusData(${item.rowId})" class="bg-red-600 text-white px-2 py-1 rounded text-xs">🗑️ Hapus</button>
            </div>
        </div>
    </div>`).join('');
}

function filterData() {
    const kata = document.getElementById('cari').value.toLowerCase();
    const hasil = daftarData.filter(item => 
        Object.values(item).some(v => String(v).toLowerCase().includes(kata))
    );
    tampilkanData(hasil);
}

function bukaForm() {
    document.getElementById('formModal').classList.remove('hidden');
    document.getElementById('formModal').classList.add('flex');
    document.getElementById('formTitle').textContent = 'Tambah Servis Baru';
    document.getElementById('formData').reset();
    document.getElementById('editRowId').value = '';
    document.getElementById('fTanggal').valueAsDate = new Date();
}

function tutupForm() {
    document.getElementById('formModal').classList.add('hidden');
    document.getElementById('formModal').classList.remove('flex');
}

function editData(id) {
    const item = daftarData.find(d => d.rowId === id);
    if (!item) return;
    document.getElementById('formModal').classList.remove('hidden');
    document.getElementById('formModal').classList.add('flex');
    document.getElementById('formTitle').textContent = 'Edit Data Servis';
    document.getElementById('editRowId').value = id;
    document.getElementById('fTanggal').value = item.Tanggal || '';
    document.getElementById('fNama').value = item.Nama || '';
    document.getElementById('fNoHP').value = item.NoHP || '';
    document.getElementById('fMerk').value = item.MerkMotor || '';
    document.getElementById('fTipe').value = item.TipeMotor || '';
    document.getElementById('fNoPlat').value = item.NoPlat || '';
    document.getElementById('fKM').value = item.Kilometer || '';
    document.getElementById('fRincian').value = item.RincianPekerjaan || '';
    document.getElementById('fBiaya').value = item.TotalBiaya || '';
    document.getElementById('fTglBerikutnya').value = item.TanggalBerikutnya || '';
    document.getElementById('fCatatan').value = item.Catatan || '';
}

document.getElementById('formData').addEventListener('submit', async e => {
    e.preventDefault();
    const rowId = document.getElementById('editRowId').value;
    const payload = {
        Tanggal: document.getElementById('fTanggal').value,
        Nama: document.getElementById('fNama').value,
        NoHP: document.getElementById('fNoHP').value,
        MerkMotor: document.getElementById('fMerk').value,
        TipeMotor: document.getElementById('fTipe').value,
        NoPlat: document.getElementById('fNoPlat').value,
        Kilometer: document.getElementById('fKM').value,
        RincianPekerjaan: document.getElementById('fRincian').value,
        TotalBiaya: document.getElementById('fBiaya').value,
        TanggalBerikutnya: document.getElementById('fTglBerikutnya').value,
        Catatan: document.getElementById('fCatatan').value
    };
    if (rowId) {
        payload.action = "update";
        payload.rowId = Number(rowId);
    }

    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        alert('✅ Tersimpan!');
        tutupForm();
        tarikDataDariSheets();
    } catch {
        alert('⚠️ Gagal tersimpan');
    }
});

async function hapusData(id) {
    if (!confirm('Yakin hapus data ini?')) return;
    try {
        await fetch(URL_GOOGLE_SHEETS, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "hapus", rowId: id })
        });
        alert('✅ Dihapus!');
        tarikDataDariSheets();
    } catch {
        alert('⚠️ Gagal dihapus');
    }
}

window.onload = initApp;
</script>
</body>
</html>
